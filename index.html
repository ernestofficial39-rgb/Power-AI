<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<meta name="description" content="Power AI adalah AI Assistant untuk coding, debugging, ESP32, Arduino, website, web search, dan image generation.">
<meta name="robots" content="index, follow">
<title>Power AI — AI Assistant</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08090d;
    --panel:#0f1118;
    --panel2:#151821;
    --border:#282c38;
    --text:#f5f7fb;
    --muted:#949aaa;
    --accent:#7c5cff;
    --accent2:#9b7cff;
    --success:#35d07f;
    --danger:#ff526b;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

.sidebar{
    width:280px;
    min-width:280px;
    height:100vh;
    background:#0b0d12;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    z-index:80;
    transition:left .25s ease;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:800;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#7c5cff,#4224d7);
    box-shadow:0 0 28px rgba(124,92,255,.35);
}

.new-chat{
    margin-top:18px;
    width:100%;
    border:1px solid var(--border);
    background:#151821;
    color:#fff;
    border-radius:12px;
    padding:12px;
    font-weight:700;
}

.new-chat:hover{
    background:#1d2130;
}

.sidebar-tools{
    padding:12px;
    display:grid;
    gap:8px;
}

.side-btn{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    color:#d7d9e2;
    text-align:left;
    padding:11px 12px;
    border-radius:10px;
    font-size:14px;
}

.side-btn:hover{
    background:#171a23;
    border-color:var(--border);
}

.history-title{
    padding:12px 18px 7px;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.history-search{
    margin:0 12px 8px;
    width:calc(100% - 24px);
    background:#11141b;
    border:1px solid var(--border);
    color:#fff;
    border-radius:9px;
    padding:9px 10px;
    outline:none;
}

.history-search:focus{
    border-color:var(--accent);
}

.history-list{
    flex:1;
    overflow-y:auto;
    padding:4px 10px 14px;
}

.history-item{
    display:flex;
    gap:5px;
    margin-bottom:4px;
}

.history-main{
    flex:1;
    min-width:0;
    background:transparent;
    border:1px solid transparent;
    color:#d7d9e0;
    padding:10px;
    border-radius:9px;
    text-align:left;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.history-main:hover,
.history-item.active .history-main{
    background:#171a24;
    border-color:var(--border);
}

.history-delete{
    border:0;
    background:transparent;
    color:#858b9b;
    padding:7px;
}

.history-delete:hover{
    color:#fff;
}

.sidebar-footer{
    border-top:1px solid var(--border);
    padding:14px;
    color:var(--muted);
    font-size:12px;
}

.sidebar-overlay{
    display:none;
}

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.topbar{
    height:62px;
    min-height:62px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    background:rgba(8,9,13,.92);
    backdrop-filter:blur(14px);
    z-index:10;
}

.menu-btn{
    display:none;
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#11131a;
    color:#fff;
    font-size:22px;
    padding:0;
}

.top-title{
    flex:1;
    font-weight:800;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--success);
    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px var(--success);
}

.top-actions{
    display:flex;
    gap:6px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    background:#11131a;
    color:#fff;
    border-radius:10px;
}

.icon-btn:hover{
    background:#1b1e29;
}

.chat{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.chat-inner{
    width:min(920px,100%);
    margin:auto;
    padding:36px 22px 175px;
}

.welcome{
    text-align:center;
    padding:8vh 10px 40px;
}

.welcome-logo{
    width:76px;
    height:76px;
    border-radius:25px;
    display:grid;
    place-items:center;
    margin:0 auto 22px;
    font-size:36px;
    background:linear-gradient(135deg,#7c5cff,#4527d9);
    box-shadow:0 0 55px rgba(124,92,255,.32);
}

.welcome h1{
    font-size:clamp(30px,5vw,46px);
    margin-bottom:12px;
}

.welcome p{
    color:var(--muted);
    max-width:680px;
    margin:auto;
    line-height:1.75;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-width:720px;
    margin:30px auto 0;
}

.quick-btn{
    background:#11141b;
    border:1px solid var(--border);
    color:#ddd;
    padding:15px;
    border-radius:12px;
    text-align:left;
}

.quick-btn:hover{
    background:#171a23;
    border-color:#50576c;
}

.message{
    display:flex;
    gap:12px;
    margin:22px 0;
    line-height:1.7;
}

.message.user{
    justify-content:flex-end;
}

.message.user .bubble{
    background:#1a1d27;
    border:1px solid #292d3a;
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:#171a24;
    border:1px solid var(--border);
}

.message.user .avatar{
    order:2;
}

.message-content{
    max-width:calc(100% - 50px);
    min-width:0;
}

.bubble{
    border-radius:14px;
    padding:13px 16px;
    background:transparent;
    word-break:break-word;
}

.bubble p{
    margin-bottom:12px;
}

.bubble p:last-child{
    margin-bottom:0;
}

.bubble ul,
.bubble ol{
    padding-left:24px;
    margin:10px 0;
}

.bubble h1,
.bubble h2,
.bubble h3{
    margin:15px 0 9px;
}

.bubble blockquote{
    border-left:3px solid var(--accent);
    padding-left:13px;
    color:#b9bdc9;
    margin:10px 0;
}

.inline-code{
    background:#171a23;
    border:1px solid #292d38;
    border-radius:5px;
    padding:2px 5px;
    font-family:Consolas,monospace;
}

.code-wrap{
    margin:14px 0;
    border:1px solid #2a2e3b;
    border-radius:11px;
    overflow:hidden;
    background:#090b10;
}

.code-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 11px;
    background:#11141b;
    color:#9298a8;
    font-size:12px;
}

.code-copy{
    border:1px solid #2b3040;
    background:#171a23;
    color:#ddd;
    border-radius:6px;
    padding:5px 8px;
}

.code-wrap pre{
    padding:15px;
    overflow-x:auto;
    margin:0;
}

.code-wrap code{
    font-family:Consolas,"Courier New",monospace;
    font-size:13px;
    line-height:1.65;
    white-space:pre;
}

.message-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
    opacity:.9;
}

.message-actions button{
    border:1px solid var(--border);
    background:#10131a;
    color:#aeb2bf;
    border-radius:7px;
    padding:5px 8px;
    font-size:12px;
}

.message-actions button:hover{
    color:#fff;
    background:#191d27;
}

.generated-image{
    margin-top:12px;
    max-width:100%;
    height:auto;
    border-radius:14px;
    border:1px solid var(--border);
    display:block;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.image-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:9px;
}

.image-actions button{
    border:1px solid var(--border);
    background:#11141b;
    color:#fff;
    padding:8px 11px;
    border-radius:8px;
}

.typing{
    display:none;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.typing.show{
    display:flex;
}

.typing-dots{
    display:flex;
    gap:4px;
}

.typing-dots span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#9297a6;
    animation:bounce 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    40%{
        transform:translateY(-5px);
        opacity:1;
    }
}

.composer-area{
    position:fixed;
    bottom:0;
    left:280px;
    right:0;
    padding:14px 20px 20px;
    background:linear-gradient(transparent,var(--bg) 28%);
    pointer-events:none;
    z-index:30;
}

.composer{
    width:min(920px,100%);
    margin:auto;
    pointer-events:auto;
    background:#11141b;
    border:1px solid #2a2e39;
    border-radius:16px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.composer textarea{
    width:100%;
    min-height:52px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    padding:16px;
    font-size:15px;
}

.composer textarea::placeholder{
    color:#6f7482;
}

.composer-bottom{
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 10px 10px;
}

.tool-btn{
    border:1px solid var(--border);
    background:#171a22;
    color:#c9ccd5;
    border-radius:9px;
    padding:8px 10px;
}

.tool-btn:hover{
    background:#202431;
    color:#fff;
}

.send-btn{
    margin-left:auto;
    width:40px;
    height:40px;
    border-radius:10px;
    border:0;
    background:var(--accent);
    color:#fff;
    font-size:17px;
}

.send-btn:hover{
    background:var(--accent2);
}

.send-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.stop-btn{
    display:none;
    background:#37151c;
    border:1px solid #652632;
    color:#ff7c8e;
}

.stop-btn.show{
    display:block;
}

.search-check{
    display:flex;
    align-items:center;
    gap:7px;
    color:#9297a6;
    font-size:12px;
    margin-left:5px;
}

.search-check input{
    accent-color:var(--accent);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#10131b;
    border:1px solid #2c3040;
    border-radius:18px;
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:17px 18px;
    border-bottom:1px solid var(--border);
}

.modal-title{
    flex:1;
    font-weight:800;
}

.modal-close{
    width:34px;
    height:34px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#171a23;
    color:#fff;
}

.modal-body{
    padding:18px;
}

.modal-body label{
    display:block;
    color:#aeb2be;
    font-size:13px;
    margin-bottom:8px;
}

.image-prompt,
.memory-textarea{
    width:100%;
    background:#090b10;
    border:1px solid #2d3240;
    color:#fff;
    border-radius:12px;
    padding:13px;
    outline:0;
    font-size:14px;
    line-height:1.6;
}

.image-prompt{
    min-height:150px;
    resize:vertical;
}

.memory-textarea{
    min-height:150px;
    resize:vertical;
}

.image-prompt:focus,
.memory-textarea:focus{
    border-color:var(--accent);
}

.image-options{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.prompt-chip{
    border:1px solid var(--border);
    background:#171a22;
    color:#bbbfc9;
    border-radius:20px;
    padding:7px 10px;
    font-size:12px;
}

.prompt-chip:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:15px 18px;
    border-top:1px solid var(--border);
}

.btn{
    border:1px solid var(--border);
    background:#171a22;
    color:#fff;
    border-radius:9px;
    padding:10px 14px;
}

.btn.primary{
    border-color:transparent;
    background:var(--accent);
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(15px);
    background:#171a22;
    border:1px solid #303545;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        box-shadow:20px 0 70px rgba(0,0,0,.5);
    }

    .sidebar.open{
        left:0;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.55);
        z-index:70;
    }

    .menu-btn{
        display:block;
        position:fixed;
        left:12px;
        top:11px;
        z-index:95;
    }

    .topbar{
        padding-left:64px;
    }

    .composer-area{
        left:0;
        padding:10px;
    }

    .chat-inner{
        padding-left:13px;
        padding-right:13px;
    }

    .quick-grid{
        grid-template-columns:1fr;
    }

    .status{
        display:none;
    }
}

@media(max-width:500px){

    .tool-btn{
        font-size:11px;
        padding:7px;
    }

    .search-check{
        font-size:10px;
    }

    .composer textarea{
        min-height:48px;
    }

    .top-actions .icon-btn:nth-child(2){
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="sidebar-header">

<div class="logo">
<div class="logo-icon">⚡</div>
<span>Power AI</span>
</div>

<button class="new-chat" id="newChatButton">
＋ Chat Baru
</button>

</div>

<div class="sidebar-tools">

<button class="side-btn" id="openImageSide">
🎨 Image Generator
</button>

<button class="side-btn" id="openMemorySide">
🧠 Global Memory
</button>

<button class="side-btn" id="exportSide">
📦 Export History
</button>

<button class="side-btn" id="clearSide">
🗑️ Hapus Semua Chat
</button>

</div>

<div class="history-title">
Riwayat Chat
</div>

<input
id="historySearch"
class="history-search"
placeholder="Cari chat..."
autocomplete="off"
>

<div
id="historyList"
class="history-list"
></div>

<div class="sidebar-footer">
Power AI SUPER<br>
AI Assistant • Online
</div>

</aside>

<div
class="sidebar-overlay"
id="sidebarOverlay"
></div>

<main class="main">

<header class="topbar">

<button
class="menu-btn"
id="menuButton"
aria-label="Menu"
>
☰
</button>

<div class="top-title">
Power AI
</div>

<div class="status">
<span class="status-dot"></span>
<span id="statusText">ONLINE</span>
</div>

<div class="top-actions">

<button
class="icon-btn"
id="openImageTop"
title="Image Generator"
>
🎨
</button>

<button
class="icon-btn"
id="openMemoryTop"
title="Memory"
>
🧠
</button>

</div>

</header>

<section
class="chat"
id="chat"
>

<div
class="chat-inner"
id="chatInner"
></div>

</section>

</main>

</div>

<div class="composer-area">

<div class="composer">

<textarea
id="messageInput"
placeholder="Tanyakan apa saja kepada Power AI..."
rows="1"
></textarea>

<div class="composer-bottom">

<button
class="tool-btn"
id="openImageBottom"
>
🎨 Gambar
</button>

<button
class="tool-btn"
id="voiceButton"
>
🎤 Voice
</button>

<button
class="tool-btn stop-btn"
id="stopButton"
>
⛔ Stop
</button>

<label class="search-check">
<input
type="checkbox"
id="webSearch"
>
Web Search
</label>

<button
class="send-btn"
id="sendButton"
>
➤
</button>

</div>

</div>

</div>

<div
class="modal"
id="imageModal"
>

<div class="modal-box">

<div class="modal-header">

<div class="modal-title">
🎨 Power AI Image Generator
</div>

<button
class="modal-close"
id="closeImageButton"
>
✕
</button>

</div>

<div class="modal-body">

<label>
Deskripsikan gambar yang ingin dibuat
</label>

<textarea
id="imagePrompt"
class="image-prompt"
placeholder="Contoh: Karakter Roblox sedang terbang dengan aura api super HD..."
></textarea>

<div class="image-options">

<button
class="prompt-chip"
data-prompt="Karakter Roblox sedang terbang dengan aura api super HD, cinematic, ultra detailed, epic lighting"
>
🔥 Aura Api
</button>

<button
class="prompt-chip"
data-prompt="Karakter Roblox menjadi dewa dengan aura energi luar biasa, cinematic, ultra HD, epic background"
>
⚡ Dewa
</button>

<button
class="prompt-chip"
data-prompt="Karakter Roblox sedang terbang di angkasa dengan aura energi biru dan ungu, ultra detailed, cinematic"
>
🌌 Cosmic
</button>

<button
class="prompt-chip"
data-prompt="Karakter Roblox menjadi superhero dengan api mengelilingi tubuh, dramatic lighting, ultra HD"
>
🦸 Superhero
</button>

</div>

</div>

<div class="modal-footer">

<button
class="btn"
id="cancelImageButton"
>
Batal
</button>

<button
class="btn primary"
id="generateImageButton"
>
✨ Generate
</button>

</div>

</div>

</div>

<div
class="modal"
id="memoryModal"
>

<div class="modal-box">

<div class="modal-header">

<div class="modal-title">
🧠 Global Memory
</div>

<button
class="modal-close"
id="closeMemoryButton"
>
✕
</button>

</div>

<div class="modal-body">

<label>
Nama pengguna
</label>

<input
id="memoryName"
class="image-prompt"
style="min-height:45px"
placeholder="Contoh: Ernest"
autocomplete="off"
>

<br><br>

<label>
Informasi lain
</label>

<textarea
id="memoryFacts"
class="memory-textarea"
placeholder="Saya suka coding
Saya sering menggunakan ESP32
Saya membuat website AI"
></textarea>

</div>

<div class="modal-footer">

<button
class="btn"
id="clearMemoryButton"
>
Hapus Memory
</button>

<button
class="btn primary"
id="saveMemoryButton"
>
💾 Simpan
</button>

</div>

</div>

</div>

<div
class="toast"
id="toast"
></div>

<script>
"use strict";

const CHAT_KEY =
"power_ai_final_chats";

const CURRENT_KEY =
"power_ai_final_current";

Math.random()
.toString(36)
.slice(2,10)
);

}

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function cleanMemory(value){

if(
!value||
typeof value!=="object"
){

return {
name:"",
facts:[]
};

}

return {

name:
typeof value.name==="string"
?value.name.trim().slice(0,100)
:"",

facts:
Array.isArray(value.facts)
?value.facts
.filter(function(item){
return (
typeof item==="string"&&
item.trim()
);
})
.map(function(item){
return item.trim().slice(0,500);
})
.slice(0,50)
:[]

};

}

?message.image

typeof value.id==="string"&&value.id
?value.id
:uid(),

typeof value.title==="string"&&
value.title.trim()
?value.title

Array.isArray(value.messages)
?value.messages
.map(cleanMessage)
.filter(Boolean)

Number(value.createdAt)||

Number(value.updatedAt)||
Date.now()

};

}

function markdownToHTML(text){

let source=
escapeHTML(text);

const blocks=[];

const tick=
String.fromCharCode(96);

const fence=
new RegExp(
tick+
tick+
tick+
"([a-zA-Z0-9_+#.-]*)\\n?"+
"([\\s\\S]*?)"+
tick+
tick+
tick,
"g"
);

source=
source.replace(
fence,
function(
match,
language,
code
){

const id=
blocks.length;

blocks.push({

language:
language||"code",

code:
code.replace(
/\n$/,
""
)

});

return (
"\n@@CODE"+
id+
"@@\n"
);

}
);

const inline=
new RegExp(
tick+
"([^"+
tick+
"\\n]+)"+
tick,
"g"
);

source=
source.replace(
inline,
"<span class=\"inline-code\">$1</span>"
);

source=
source
.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
)
.replace(
/^## (.*)$/gm,
"<h2>$1</h2>"
)
.replace(
/^# (.*)$/gm,
"<h1>$1</h1>"
)
.replace(
/\*\*(.*?)\*\*/g,
"<strong>$1</strong>"
)
.replace(
/\*(.*?)\*/g,
"<em>$1</em>"
)
.replace(
/^> (.*)$/gm,
"<blockquote>$1</blockquote>"
)
.replace(
/^\s*[-*] (.*)$/gm,
"<li>$1</li>"
)
.replace(
/((?:<li>.*<\/li>\s*)+)/g,
"<ul>$1</ul>"
)
.replace(
/\n\n+/g,
"</p><p>"
);

source=
"<p>"+
source+
"</p>";

source=
source.replace(
/\n/g,
"<br>"
);

blocks.forEach(
function(
block,
index
){

const html=
'<div class="code-wrap">'+
'<div class="code-head">'+
'<span>'+
escapeHTML(
block.language
)+
'</span>'+
'<button class="code-copy" data-code="'+
encodeURIComponent(
block.code
)+
'">Salin Kode</button>'+
'</div>'+
'<pre><code>'+
escapeHTML(
block.code
)+
'</code></pre>'+
'</div>';

source=
source.replace(
"@@CODE"+
index+
"@@",
html
);

}
);

return source;

}

}

}

getCurrentChat();

current=createChat();
}

);

);

});

"";

saveState();

renderHistory();

renderChat();

scrollBottom();

data.webSearch

"AbortError"
){

);

"ONLINE";

return;

}

"CHAT ERROR",
error
);

getCurrentChat();

const last=
failed.messages[
failed.messages.length-1
];

if(
last&&
last.role==="user"&&
last.content===text
){

failed.messages.pop();

}

failed.updatedAt=
Date.now();

saveState();

renderChat();

text;

resizeInput();

"ERROR";

error.message||

null;

"BERPIKIR..."

throw new Error(
data.error||
"Image Generator gagal."
);

}

current=
getCurrentChat();

if(!current){
return;
}

current.messages.push({

role:
"assistant",

content:
"🎨 Gambar berhasil dibuat.",

image:
data.image,

imagePrompt:
prompt

});

current.updatedAt=
Date.now();

try{

saveState();

}catch(error){

console.warn(
"History gambar tidak tersimpan penuh.",
error
);

}

renderHistory();
renderChat();

showToast(
"🎨 Gambar berhasil dibuat!"
);

}catch(error){

removeTyping();

if(
error.name===
"AbortError"
){

showToast(
"Pembuatan gambar dihentikan."
);

return;

}

console.error(
"IMAGE ERROR",
error
);

const latest=
getCurrentChat();

if(latest){

latest.messages.push({

role:
"assistant",

content:
"❌ Image Generator Error: "+
(
error.message||
"Terjadi kesalahan."
)

});

latest.updatedAt=
Date.now();

saveState();

renderChat();

}

showToast(
error.message||
"Image Generator gagal."
);

}finally{

setLoading(false);

abortController=
null;

statusText.textContent=
"ONLINE";

}

}

function openMemory(){

memoryName.value=
memory.name||
"";

memoryFacts.value=
memory.facts.join(
"\n"
);

memoryModal.classList.add(
"show"
);

setTimeout(
function(){

memoryName.focus();

},
80
);

}

function closeMemory(){

memoryModal.classList.remove(
"show"
);

}

function saveMemoryFromModal(){

memory=
cleanMemory({

name:
memoryName.value,

facts:
memoryFacts.value
.split("\n")

});

saveMemory();

closeMemory();

showToast(
"🧠 Global Memory tersimpan."
);

}

function clearMemory(){

if(
!confirm(
"Hapus Global Memory?"
)
){

return;

}

memory={
name:"",
facts:[]
};

saveMemory();

memoryName.value=
"";

memoryFacts.value=
"";

showToast(
"Memory dihapus."
);

}

function startVoice(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){

showToast(
"Browser ini tidak mendukung Voice Input."
);

return;

}

if(recognition){

recognition.stop();

recognition=
null;

return;

}

recognition=
new SR();

recognition.lang=
"id-ID";

recognition.continuous=
false;

recognition.interimResults=
true;

recognition.onresult=
function(event){

let text=
"";

for(
let i=
event.resultIndex;
i<
event.results.length;
i++
){

text+=
event.results[i][0]
.transcript;

}

input.value=
text;

resizeInput();

};

recognition.onerror=
function(error){

console.error(
"VOICE ERROR",
error
);

showToast(
"Voice Input gagal."
);

recognition=
null;

};

recognition.onend=
function(){

recognition=
null;

};

try{

recognition.start();

showToast(
"🎤 Silakan bicara..."
);

}catch(error){

console.error(
"VOICE START ERROR",
error
);

recognition=
null;

}

}

abortController.abort();

}

}

function exportChats(){

try{

const payload={

exportedAt:
new Date().toISOString(),

chats:
chats,

memory:
memory

};

const blob=
new Blob(
[
JSON.stringify(
payload,
null,
2
)
],
{
type:
"application/json"
}
);

const url=
URL.createObjectURL(
blob
);

const a=
document.createElement(
"a"
);

a.href=
url;

a.download=
"power-ai-backup.json";

document.body.appendChild(
a
);

a.click();

a.remove();

setTimeout(
function(){

URL.revokeObjectURL(
url
);

},
1000
);

showToast(
"📦 History berhasil diexport."
);

}catch(error){

console.error(
"EXPORT ERROR",
error
);

showToast(
"Gagal export history."
);

}

}

deleteButton.dataset.deleteId
);

event.target.closest(

);

input.value=
quick.dataset.quick;

resizeInput();

sendMessage();

return;

}

event.target.closest(
"[data-open-image]"
);

openImageGenerator();

return;

}

const copyAll=
event.target.closest(
"[data-copy-all]"
);

if(copyAll){

const message=
copyAll.closest(
".message"
);

if(message){

const bubble=
message.querySelector(
".bubble"
);

if(bubble){

copyText(
bubble.innerText
);

}

}

return;

}

const speak=
event.target.closest(
"[data-speak]"
);

if(speak){

const message=
speak.closest(
".message"
);

if(
message&&
"speechSynthesis" in window
){

const bubble=
message.querySelector(
".bubble"
);

if(bubble){

window
.speechSynthesis
.cancel();

const utterance=
new SpeechSynthesisUtterance(
bubble.innerText
);

utterance.lang=
"id-ID";

utterance.rate=
.95;

window
.speechSynthesis
.speak(
utterance
);

}

}else{

showToast(
"Text-to-Speech tidak tersedia."
);

}

return;

}

const regenerate=
event.target.closest(
"[data-regenerate]"
);

regenerateMessage(
Number(
regenerate.dataset.regenerate
)
);

return;

}

event.target.closest(
"[data-edit]"
);

Number(
edit.dataset.edit
)
);

}

event.target.closest(

);

""
)
);
